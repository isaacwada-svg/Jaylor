<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Jaylor — Offline</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #111f39;
        color: #f8f4e9;
        font-family:
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          Roboto,
          Helvetica,
          Arial,
          sans-serif;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        box-sizing: border-box;
      }
      .card {
        max-width: 360px;
        text-align: center;
      }
      img {
        width: 72px;
        height: 72px;
        border-radius: 18px;
        margin-bottom: 20px;
      }
      h1 {
        font-size: 20px;
        margin: 0 0 8px;
      }
      p {
        font-size: 14px;
        line-height: 1.5;
        color: rgba(248, 244, 233, 0.75);
        margin: 0 0 24px;
      }
      button {
        appearance: none;
        border: none;
        border-radius: 999px;
        padding: 10px 24px;
        background: #c9a24b;
        color: #111f39;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
      }
      button:active {
        opacity: 0.85;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <img src="/icon-192.png" alt="" />
      <h1>You're offline</h1>
      <p>
        Jaylor can't reach the network right now. Anything you add here — orders, clients,
        measurements, payments — is saved on your phone and will sync the moment you're back
        online.
      </p>
      <button onclick="location.reload()">Try again</button>
    </div>
  </body>
</html>
